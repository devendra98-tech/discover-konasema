<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#blueGradient)"/>
  
  <!-- Coconut tree trunk -->
  <rect x="45" y="35" width="10" height="30" fill="#8B4513" rx="2"/>
  
  <!-- Coconut tree leaves -->
  <path d="M 30 40 Q 50 20, 70 40 Q 50 25, 30 40" fill="url(#goldGradient)"/>
  <path d="M 35 45 Q 50 28, 65 45 Q 50 32, 35 45" fill="url(#goldGradient)"/>
  <path d="M 40 50 Q 50 35, 60 50 Q 50 38, 40 50" fill="url(#goldGradient)"/>
  
  <!-- Water waves at bottom -->
  <path d="M 0 70 Q 25 65, 50 70 T 100 70 L 100 100 L 0 100 Z" fill="#3b82f6" opacity="0.6"/>
  <path d="M 0 75 Q 25 70, 50 75 T 100 75 L 100 100 L 0 100 Z" fill="#1e3a8a" opacity="0.4"/>
</svg>


